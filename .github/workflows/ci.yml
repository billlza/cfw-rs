name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: cargo test (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Assert Apple Silicon
        run: ./scripts/assert_apple_silicon.sh
      # tauri.conf resources paths must exist; binaries are gitignored (.keep tracked).
      - name: Ensure resource dirs
        run: |
          test -d apps/cfw-tauri-shell/resources/cores
          test -d apps/cfw-tauri-shell/resources/helpers
      - name: Test workspace
        run: cargo test --workspace

  # Full tauri bundle needs secrets + signing; keep compile check light here.
  check-shell:
    name: check tauri shell
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Assert Apple Silicon
        run: ./scripts/assert_apple_silicon.sh
      - name: Fetch pinned cores
        run: |
          ./scripts/fetch_clash_rs.sh
          ./scripts/fetch_core.sh
      - name: Build helper resource
        run: ./scripts/build_helper_resource.sh
      - name: cargo check shell
        run: cargo check -p cfw-tauri-shell

  clashrs-smoke:
    name: clash-rs controller smoke (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Assert Apple Silicon
        run: ./scripts/assert_apple_silicon.sh
      - name: Fetch clash-rs + smoke
        run: |
          chmod +x scripts/fetch_clash_rs.sh scripts/clash_rs_smoke.sh scripts/assert_apple_silicon.sh scripts/fetch_core.sh scripts/kernel_compare.py
          ./scripts/clash_rs_smoke.sh
      - name: Measured kernel compare
        run: |
          ./scripts/fetch_core.sh
          python3 scripts/kernel_compare.py
          test -f apps/cfw-tauri-shell/resources/benchmarks/kernel-compare-latest.json

  cfw-perf-gate:
    name: cfw-perf-gate (arm64 record only)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Assert Apple Silicon
        run: ./scripts/assert_apple_silicon.sh
      - name: Record metrics (no 3x claim)
        run: |
          chmod +x scripts/cfw_perf_gate.sh scripts/assert_apple_silicon.sh
          ./scripts/cfw_perf_gate.sh
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfw-perf-gate
          path: target/perf-gate/
          if-no-files-found: ignore
