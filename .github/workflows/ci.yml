name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: cargo test (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # tauri.conf resources paths must exist; binaries are gitignored (.keep tracked).
      - name: Ensure resource dirs
        run: |
          test -d apps/cfw-tauri-shell/resources/cores
          test -d apps/cfw-tauri-shell/resources/helpers
      - name: Test workspace
        run: cargo test --workspace

  # Full tauri bundle needs secrets + signing; keep compile check light here.
  check-shell:
    name: check tauri shell
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pinned core
        run: ./scripts/fetch_core.sh
      - name: Build helper resource
        run: ./scripts/build_helper_resource.sh
      - name: cargo check shell
        run: cargo check -p cfw-tauri-shell
