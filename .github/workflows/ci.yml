name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: "/bin/bash --noprofile --norc -p -e -o pipefail {0}"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  rust-and-ui:
    name: Rust, UI, and script quality gates
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact CI source and workflow identity ${{ github.workflow_sha }}
        run: /bin/test "$(/usr/bin/git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Normalize pinned Xcode ownership
        run: |
          readonly xcode_application=/Applications/Xcode_26.6.app
          /bin/test "$DEVELOPER_DIR" = "$xcode_application/Contents/Developer"
          /bin/test -d "$xcode_application"
          /bin/test ! -L "$xcode_application"
          /bin/test -d "$xcode_application/Contents"
          /bin/test ! -L "$xcode_application/Contents"
          /bin/test -d "$xcode_application/Contents/Developer"
          /bin/test ! -L "$xcode_application/Contents/Developer"
          /usr/sbin/spctl --assess --type execute "$xcode_application"
          /bin/test "$(DEVELOPER_DIR="$DEVELOPER_DIR" /usr/bin/xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'

          runner_uid="$(/usr/bin/id -u)"
          readonly runner_uid
          /bin/test "$runner_uid" -ne 0
          runner_groups=" $(/usr/bin/id -G) "
          readonly runner_groups
          [[ "$runner_groups" != *" 0 "* ]]
          xcode_device_inode="$(/usr/bin/stat -f '%d:%i' "$xcode_application")"
          readonly xcode_device_inode
          unexpected_entry="$(
            /usr/bin/find -P -x "$xcode_application" \
              \( \( ! -uid 0 -a ! -uid "$runner_uid" \) -o -perm -0002 \) \
              -print -quit
          )"
          readonly unexpected_entry
          /bin/test -z "$unexpected_entry"

          /usr/bin/sudo -n /usr/bin/find -P -x "$xcode_application" \
            -exec /usr/sbin/chown -h 0:0 {} +

          /bin/test "$(/usr/bin/stat -f '%d:%i' "$xcode_application")" = "$xcode_device_inode"
          remaining_unsafe_entry="$(
            /usr/bin/find -P -x "$xcode_application" \
              \( ! -uid 0 -o ! -gid 0 -o -perm -0002 \) -print -quit
          )"
          readonly remaining_unsafe_entry
          /bin/test -z "$remaining_unsafe_entry"
          /usr/sbin/spctl --assess --type execute "$xcode_application"
          /bin/test "$(DEVELOPER_DIR="$DEVELOPER_DIR" /usr/bin/xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: validation-python
        with:
          python-version: "3.14.6"
          architecture: arm64
          update-environment: false
      - name: Prepare lock-verified Cargo workspace sources
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' prepare-cargo-workspace-inputs
      - name: Install pinned release identity tools
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' bootstrap-policy-tools
      - name: Assert Apple Silicon host
        run: ./scripts/assert_apple_silicon.sh
      - name: Assert pinned Apple toolchain
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' apple-toolchain
      - name: Verify build-script boundary
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' build-script-boundary
      - name: Audit deterministic CI lanes for masking and toolchain drift
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' ci-no-masking
      - name: Verify evidence manifest lane (positive and negative)
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' evidence-manifest-lane
      - name: Verify 0.4.0 version contract
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' version-contract
      - name: Check Rust formatting
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' rust-fmt
      - name: Verify locked Rust dependency graph
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' rust-metadata
      - name: Bootstrap verified Node toolchain
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' bootstrap-node-toolchain
      - name: Prepare and seal UI dependencies
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' prepare-ui-dependencies
      - name: Test UI
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' ui-test
      - name: Build UI
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' ui-build
      - name: Audit UI dependencies
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' ui-audit
      - name: Lint Rust workspace
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' rust-clippy
      - name: Test Rust workspace
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' rust-test
      - name: Test release tooling
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' release-tool-tests
      - name: Validate shell scripts
        run: |
          while IFS= read -r script; do
            /bin/bash -n "$script"
            /bin/zsh -n "$script"
          done < <(/usr/bin/find scripts -type f -name '*.sh' | /usr/bin/sort)
      - name: Lint shell scripts with pinned ShellCheck
        run: |
          source scripts/dependency_pins.env
          archive="$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION.darwin.aarch64.tar.gz"
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.darwin.aarch64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_DARWIN_ARM64_SHA256" "$archive" | /usr/bin/shasum -a 256 --check
          /usr/bin/tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION/shellcheck" -x scripts/*.sh scripts/tests/*.sh

  supply-chain:
    name: macOS Rust supply-chain policy
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact CI source and workflow identity ${{ github.workflow_sha }}
        run: /bin/test "$(/usr/bin/git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: validation-python
        with:
          python-version: "3.14.6"
          architecture: arm64
          update-environment: false
      - name: Prepare lock-verified Cargo workspace sources
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' prepare-cargo-workspace-inputs
      - name: Install pinned policy tools
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' bootstrap-policy-tools
      - name: Audit exact shipped Rust target graph
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' rust-target-audit
      - name: Enforce dependency, source, and license policy
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' cargo-deny

  native-and-package:
    name: libbox, Network Extension, and app skeleton gates
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact CI source and workflow identity ${{ github.workflow_sha }}
        run: /bin/test "$(/usr/bin/git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        id: validation-python
        with:
          python-version: "3.14.6"
          architecture: arm64
          update-environment: false
      - name: Prepare lock-verified Cargo workspace sources
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' prepare-cargo-workspace-inputs
      - name: Install pinned CI toolchain identity tools
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' bootstrap-policy-tools
      - name: Assert pinned release host toolchain
        run: |
          source scripts/dependency_pins.env
          ./scripts/assert_apple_silicon.sh
          test "$(/usr/bin/xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
          swift_identity_stderr="$(/usr/bin/mktemp "$RUNNER_TEMP/swift-target-info.XXXXXX")"
          cleanup_swift_identity_stderr() {
            /bin/rm -f -- "$swift_identity_stderr"
          }
          trap cleanup_swift_identity_stderr EXIT
          if ! swift_target_info="$(
              /usr/bin/swift -print-target-info \
                -target "arm64-apple-macosx$MACOS_DEPLOYMENT_TARGET" \
                2>"$swift_identity_stderr"
            )"; then
            /bin/cat "$swift_identity_stderr" >&2
            exit 1
          fi
          if [[ -s "$swift_identity_stderr" ]]; then
            /bin/cat "$swift_identity_stderr" >&2
            exit 1
          fi
          if [[ -z "$swift_target_info" ]]; then
            echo "error: Swift target identity is empty" >&2
            exit 1
          fi
          cleanup_swift_identity_stderr
          trap - EXIT
          validation_python='${{ steps.validation-python.outputs.python-path }}'
          test "$("$validation_python" --version)" = "Python $PYTHON_VERSION"
          policy_root="$HOME/.cfm-release-tooling/policy-$CARGO_AUDIT_VERSION-$CARGO_DENY_VERSION/bin"
          test "$("$policy_root/cargo-audit" --version)" = "cargo-audit $CARGO_AUDIT_VERSION"
          test "$("$policy_root/cargo-deny" --version)" = "cargo-deny $CARGO_DENY_VERSION"
      - name: Bootstrap verified release tools
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' bootstrap-release-toolchain
      - name: Build and verify pinned packet LAN peer
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' packet-lan-peer
      - name: Verify generated Xcode project
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' verify-xcode-project
      - name: Materialize pinned libbox source
        run: |
          upstream="$RUNNER_TEMP/sing-box-upstream"
          patched="$RUNNER_TEMP/sing-box-patched"
          ./scripts/run_release_ci_gate.sh \
            --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' \
            fetch-libbox-upstream "$upstream"
          ./scripts/run_release_ci_gate.sh \
            --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' \
            materialize-libbox-source "$upstream" "$patched"
          echo "SING_BOX_SOURCE=$patched" >>"$GITHUB_ENV"
      - name: Prepare and verify Go module graph
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' libbox-source-tests "$SING_BOX_SOURCE"
      - name: Scan linked libbox graph
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' libbox-vulnerability-scan "$SING_BOX_SOURCE"
      - name: Build source-bound libbox
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' build-libbox "$SING_BOX_SOURCE"
      - name: Check Swift formatting
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' swift-format-lint
      - name: Test Swift package
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' swift-package-test
      - name: Test Xcode targets
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' xcode-unsigned-test
      - name: Analyze Xcode targets
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' xcode-analyze
      - name: Prepare and seal UI dependencies
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' prepare-ui-dependencies
      - name: Install pinned Tauri CLI
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' install-tauri-cli
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Exercise real pinned updater signer boundary
        run: ./scripts/run_release_ci_gate.sh --validation-python-executable '${{ steps.validation-python.outputs.python-path }}' updater-signer-integration
      - name: Build and verify unsigned application skeleton
        run: >-
          ./scripts/build_unsigned_candidate.sh
          --validation-python-executable
          '${{ steps.validation-python.outputs.python-path }}'
