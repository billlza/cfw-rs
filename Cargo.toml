[workspace]
members = [
  "apps/cfw-tauri-shell",
  "apps/cfw-cli",
  "crates/cfw-core",
  "crates/cfw-controller",
  "crates/cfw-profiles",
  "crates/cfw-runtime",
  "crates/cfw-platform",
  "crates/cfw-helper",
  "crates/serde_yaml",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["bill"]
rust-version = "1.97"

# Release profile tuned for aarch64-apple-darwin: maximum optimization, whole-
# program LTO and a single codegen unit for the best runtime performance, with
# symbols stripped to keep the shipped bundle small. panic=unwind is kept so
# tokio/reqwest behave as upstream expects.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
anyhow = "1.0"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
noyalib = { version = "0.0.15", features = ["compat-serde-yaml"] }
serde_yaml = { path = "crates/serde_yaml" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
qrcode = "0.14"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tracing = "0.1"
url = "2.5"
urlencoding = "2.1"
