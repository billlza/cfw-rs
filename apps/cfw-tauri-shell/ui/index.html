<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Clash for Mac</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="status-bar" data-tauri-drag-region>
      <div class="status-progress" aria-hidden="true"><i id="traffic-progress"></i></div>
      <span id="status-title">Clash for Mac</span>
      <button id="reload-button" class="status-button" title="Reload dashboard" data-i18n="Reload">Reload</button>
    </header>

    <div class="app-shell">
      <aside class="sidebar">
        <section class="traffic-pane">
          <div class="traffic-row">
            <span aria-hidden="true">&uarr;</span>
            <strong id="upload-rate">0.0 MB/s</strong>
          </div>
          <div class="traffic-row">
            <span aria-hidden="true">&darr;</span>
            <strong id="download-rate">0.0 MB/s</strong>
          </div>
        </section>

        <nav id="nav" class="nav-list" aria-label="Primary navigation"></nav>

        <section class="runtime-pane">
          <span data-i18n="Running Time">Running Time</span>
          <strong id="runtime-value">00 : 00 : 00</strong>
        </section>

        <section class="sidebar-meta">
          <p class="connected-line"><i id="sidebar-status-dot"></i><strong id="sidebar-status">Disconnected</strong></p>
        </section>
      </aside>

      <main class="workspace">
        <h2 id="page-title" class="visually-hidden">General</h2>
        <p id="page-summary" class="visually-hidden">Runtime overview</p>
        <section id="page" class="page" aria-live="polite">
          <div class="startup-screen" role="status" aria-label="Starting Clash for Mac">
            <span class="startup-spinner" aria-hidden="true"></span>
            <div>
              <strong data-i18n="Starting Clash for Mac">Starting Clash for Mac</strong>
              <p data-i18n="Loading verified settings and network state…">Loading verified settings and network state…</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="glass-menu-root" aria-live="polite"></div>
    <script src="./startup.js"></script>
    <script id="dashboard-script" src="./main.js"></script>
  </body>
</html>
