[package]
name = "cfw-platform"
version = "0.4.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
objc2-core-wlan = { version = "=0.3.2", default-features = false, features = ["std", "CWWiFiClient", "CWInterface"] }
objc2-core-location = { version = "=0.3.2", default-features = false, features = ["std", "CLLocationManager"] }
objc2-service-management = "0.3.2"
objc2-system-configuration = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFString", "CFNumber", "CFArray"] }
