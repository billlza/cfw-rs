[package]
name = "cfw-platform"
version = "0.5.0"
edition = "2024"
license.workspace = true

[features]
native-shell-validation = []

[dependencies]
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
objc2-core-wlan = { version = "=0.3.2", default-features = false, features = ["std", "CWWiFiClient", "CWInterface"] }
objc2-core-location = { version = "=0.3.2", default-features = false, features = ["std", "CLLocationManager"] }
objc2-service-management = "0.3.2"
objc2-system-configuration = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFString", "CFNumber", "CFArray"] }

[target.'cfg(windows)'.dependencies]
url.workspace = true
windows = { version = "=0.62.2", features = ["Networking_Connectivity", "Foundation_Collections", "Win32_System_WinRT"] }
windows-sys = { version = "=0.61.2", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security"] }

[[test]]
name = "native_shell_dispatch"
required-features = ["native-shell-validation"]

[[example]]
name = "native-shell-dispatch-fixture"
path = "examples/native_shell_dispatch.rs"
required-features = ["native-shell-validation"]
