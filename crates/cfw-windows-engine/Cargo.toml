[package]
name = "cfw-windows-engine"
version = "0.5.0"
edition.workspace = true
license.workspace = true

[features]
native-engine-validation = []
native-service-validation = []

[dependencies]
cfw-singbox-config = { path = "../cfw-singbox-config" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
cfw-engine-api = { path = "../cfw-engine-api" }
cfw-windows-storage = { path = "../cfw-windows-storage" }
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
uuid.workspace = true
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Networking_WinInet",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemServices",
  "Win32_System_RemoteDesktop",
] }

[dev-dependencies]
cfw-engine-api = { path = "../cfw-engine-api" }
sha2.workspace = true
tempfile.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dev-dependencies]
cfw-windows-credentials = { path = "../cfw-windows-credentials" }
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
windows-sys = { version = "=0.61.2", features = ["Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi"] }

[[test]]
name = "native_engine"
required-features = ["native-engine-validation"]

[[example]]
name = "native-service-fixture"
path = "examples/native_service/main.rs"
required-features = ["native-service-validation"]
