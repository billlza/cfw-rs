[package]
name = "cfw-windows-engine"
version = "0.5.0"
edition.workspace = true
license.workspace = true

[features]
native-engine-validation = []
native-service-validation = []
native-package-validation = []
# Compile the shared desktop's optional observation receipt path in validation.
physical-release-evidence = []

[dependencies]
cfw-singbox-config = { path = "../cfw-singbox-config" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
semver.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
cfw-engine-api = { path = "../cfw-engine-api" }
cfw-windows-credentials = { path = "../cfw-windows-credentials" }
cfw-windows-storage = { path = "../cfw-windows-storage" }
subtle = "=2.6.1"
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
uuid.workspace = true
url.workspace = true
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Networking_WinInet",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Wdk_System_SystemServices",
  "Win32_System_RemoteDesktop",
  "Win32_System_RestartManager",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Com",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_UI_Shell",
] }

[dev-dependencies]
cfw-application = { path = "../cfw-application" }
cfw-platform = { path = "../cfw-platform" }
cfw-engine-api = { path = "../cfw-engine-api" }
sha2.workspace = true
subtle = "=2.6.1"
tempfile.workspace = true
uuid.workspace = true
url.workspace = true

[target.'cfg(windows)'.dev-dependencies]
cfw-core = { path = "../cfw-core" }
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
windows-sys = { version = "=0.61.2", features = ["Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_System_Time"] }

[[test]]
name = "native_engine"
required-features = ["native-engine-validation"]

[[test]]
name = "native_update_package"
required-features = ["native-package-validation"]

[[test]]
name = "native_update_worker"
required-features = ["native-package-validation"]

[[example]]
name = "native-wintun-probe"
path = "examples/native_wintun.rs"
required-features = ["native-service-validation"]

[[example]]
name = "native-update-worker-fixture"
path = "examples/native_update_worker.rs"
required-features = ["native-package-validation"]

[[example]]
name = "native-service-fixture"
path = "examples/native_service/main.rs"
required-features = ["native-service-validation"]
