steps:
  - id: verify-source-closure
    name: golang:1.27.1@sha256:f44f6e88636cfb311f9ebace870ded69d943f227bb3cb27d32ffd84ea18c43ea
    entrypoint: /bin/bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        actual="$(./source_digest.sh)"
        if [[ ! "${_EXPECTED_SOURCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
          echo 'error: _EXPECTED_SOURCE_SHA256 must be an approved lowercase SHA-256' >&2
          exit 1
        fi
        if [[ "$actual" != "${_EXPECTED_SOURCE_SHA256}" ]]; then
          echo 'error: collector source closure differs from the approved digest' >&2
          exit 1
        fi
        printf '%s\n' "$actual" > /workspace/.collector-source-sha256
        printf 'collector source closure verified: %s\n' "$actual"

  - id: test
    name: golang:1.27.1@sha256:f44f6e88636cfb311f9ebace870ded69d943f227bb3cb27d32ffd84ea18c43ea
    entrypoint: go
    env:
      - CGO_ENABLED=0
    args:
      - test
      - ./...

  - id: vet
    name: golang:1.27.1@sha256:f44f6e88636cfb311f9ebace870ded69d943f227bb3cb27d32ffd84ea18c43ea
    entrypoint: go
    env:
      - CGO_ENABLED=0
    args:
      - vet
      - ./...

  - id: build-image
    name: gcr.io/cloud-builders/docker@sha256:e036091375b816e40f07620582d1dfaa0e2c2da58ea5731fdcf560534b2a4a57
    entrypoint: /bin/bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        source_digest="$(cat /workspace/.collector-source-sha256)"
        exec docker build \
          --file Dockerfile \
          --label "com.bill.clashformac.collector-source-sha256=$source_digest" \
          --tag "${_IMAGE_URI}" \
          .

images:
  - ${_IMAGE_URI}

substitutions:
  _EXPECTED_SOURCE_SHA256: REQUIRED
  _IMAGE_URI: asia-east1-docker.pkg.dev/${PROJECT_ID}/physical-evidence-control/physical-collector:${BUILD_ID}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
